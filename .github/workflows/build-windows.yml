name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sirius-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Python, Playwright and PyInstaller work files
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\ms-playwright
            build\sirius-backend
          key: windows-python-${{ runner.arch }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            windows-python-${{ runner.arch }}-

      - name: Cache Cargo work files
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            sirius-ui\src-tauri\target
          key: windows-cargo-${{ runner.arch }}-${{ hashFiles('sirius-ui/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-${{ runner.arch }}-

      - name: Install Python runtime
        run: python setup.py

      - name: Install frontend dependencies
        working-directory: sirius-ui
        run: npm ci

      - name: Build backend sidecar
        run: python build_backend.py --cached --profile=release

      - name: Build Tauri application
        working-directory: sirius-ui
        run: npx tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: sirius-windows-installers
          path: sirius-ui/src-tauri/target/release/bundle/
          if-no-files-found: error
